#################################
# Backend & Performance
#################################
backend = "glx";
vsync = true;
use-damage = true;
experimental-backends = true;

#################################
# Shadows
#################################
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.6;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-exclude = [
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'"
];

#################################
# Fading
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;

#################################
# Opacity (Global)
#################################
active-opacity = 1.0;              # focused windows fully opaque
inactive-opacity = 0.9;            # unfocused windows semi-transparent
frame-opacity = 0.9;
inactive-opacity-override = true;  # force inactive opacity globally

#################################
# Blur
#################################
blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;

# Only blur inactive windows
blur-background-exclude = [
  "focused = 1",                   # don’t blur active windows
  "window_type = 'desktop'"
];

#################################
# Corners
#################################
corner-radius = 0;
round-borders = 0;
rounded-corners-exclude = [];

