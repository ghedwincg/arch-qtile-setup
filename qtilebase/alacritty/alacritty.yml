# Import the colors generated by Pywal
import:
  - ~/.cache/wal/colors-alacritty.yml

window:
  # Adjust opacity here (0.0 to 1.0)
  opacity: 0.9
  padding:
    x: 10
    y: 10

font:
  normal:
    family: "JetBrainsMono Nerd Font"
    style: Regular
  size: 12.0

cursor:
  style:
    shape: Block
    blinking: On

# Note: The 'colors' section is removed because it is 
# now imported dynamically from the Pywal cache.
